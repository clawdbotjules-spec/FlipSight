# FlipSight — Phase 1 stack: postgres + redis + api.
#
# Copy .env.example to .env first (defaults work out of the box for local dev):
#   cp .env.example .env
#   docker compose up --build
#
# Later phases add the commented services below (web, per-source workers,
# caddy). Every service gets a healthcheck and `restart: unless-stopped` —
# no cron hacks, long-running processes with graceful recovery.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipsight}
      POSTGRES_DB: ${POSTGRES_DB:-flipsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flipsight} -d ${POSTGRES_DB:-flipsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flipsight}:${POSTGRES_PASSWORD:-flipsight}@postgres:5432/${POSTGRES_DB:-flipsight}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-flipsight-dev-secret-change-me-please}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

