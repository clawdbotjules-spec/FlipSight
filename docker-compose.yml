# FlipSight — postgres + redis + api + five source workers.
#
# Copy .env.example to .env first (defaults work out of the box for local dev):
#   cp .env.example .env
#   docker compose up --build
#
# Every service has a healthcheck and `restart: unless-stopped` — no cron
# hacks; long-running workers with graceful recovery. The api service applies
# migrations on boot; workers wait for it to be healthy.

x-worker-env: &worker-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-flipsight}:${POSTGRES_PASSWORD:-flipsight}@postgres:5432/${POSTGRES_DB:-flipsight}
  REDIS_URL: redis://redis:6379
  HEALTH_PORT: 8080
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-worker-depends: &worker-depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  api: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipsight}
      POSTGRES_DB: ${POSTGRES_DB:-flipsight}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flipsight} -d ${POSTGRES_DB:-flipsight}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-flipsight}:${POSTGRES_PASSWORD:-flipsight}@postgres:5432/${POSTGRES_DB:-flipsight}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-flipsight-dev-secret-change-me-please}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Source workers — long-running BullMQ processes, one per source. The api
  # service owns migrations, so workers wait for it to be healthy.
  # ---------------------------------------------------------------------------

  worker-ebay:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-ebay }
    environment:
      <<: *worker-env
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
    depends_on: *worker-depends
    healthcheck: &worker-healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker-keepa:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-keepa }
    environment:
      <<: *worker-env
      KEEPA_API_KEY: ${KEEPA_API_KEY:-}
    depends_on: *worker-depends
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-goodwill:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-goodwill }
    environment:
      <<: *worker-env
    depends_on: *worker-depends
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-retail:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-retail }
    environment:
      <<: *worker-env
      HOME_ZIP: ${HOME_ZIP:-32114}
      TARGET_API_KEY: ${TARGET_API_KEY:-}
      WALMART_CONSUMER_ID: ${WALMART_CONSUMER_ID:-}
      WALMART_PRIVATE_KEY: ${WALMART_PRIVATE_KEY:-}
      WALMART_KEY_VERSION: ${WALMART_KEY_VERSION:-1}
    depends_on: *worker-depends
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-estate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-estate }
    environment:
      <<: *worker-env
      HOME_ZIP: ${HOME_ZIP:-32114}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on: *worker-depends
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-valuate:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args: { WORKER: worker-valuate }
    environment:
      <<: *worker-env
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      KEEPA_API_KEY: ${KEEPA_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
    depends_on: *worker-depends
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Phase 3+ services — uncomment as they land.
  # ---------------------------------------------------------------------------

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # The URL the BROWSER uses to reach the API (baked at build time).
        NEXT_PUBLIC_API_URL: ${APP_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # caddy:
  #   image: caddy:2-alpine
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddydata:/data
  #   depends_on:
  #     api: { condition: service_healthy }
  #   restart: unless-stopped

volumes:
  pgdata:
  redisdata:
